[project]
name = "bitikocr"
version = "0.1.0"
description = "Handwritten text recognition for Uzbek documents"
readme = "README.md"
authors = [
    { name = "shohrux1sakov", email = "shohrux1sakovwork@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bitikocr"
module-root = ""
# Fonts, blank scans and layouts ship with the package; the documents
# generated from them do not.
source-exclude = ["data/synthetic/output"]
# Nothing generated ships; the assets do. The suite lives outside the
# package, in tests/ at the repository root, so it never reaches a wheel.
wheel-exclude = ["data/synthetic/output"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[project.optional-dependencies]
# Making training data needs an image stack; consuming it needs a model
# stack. They are separate extras because most work needs only one of them.
data = [
    "fonttools>=4.63.0",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
]
train = [
    "accelerate>=1.14.0",
    "qwen-vl-utils>=0.0.14",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.16.1",
    "ujson>=5.10.0",
]

[tool.black]
line-length = 80
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 80
# generate_synth is the entry point in scripts/, imported by its test.
known_first_party = ["bitikocr", "generate_synth"]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
# E501 is left to black; F403/F405 allow the re-export style used in
# __init__.py files.
ignore = ["E501", "F403", "F405"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
# Kept in step with [tool.isort]; ruff does not read that section.
known-first-party = ["bitikocr", "generate_synth"]

[tool.mypy]
# No python_version pin: numpy's bundled stubs need 3.12+ syntax, and the
# minimum supported version is already enforced by ruff's target-version.
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["bitikocr", "tests", "scripts"]

[tool.pytest.ini_options]
# Every test lives in tests/ at the repository root, one module per module
# of the package, sharing the fixtures in tests/conftest.py.
testpaths = ["tests"]
# Entry points live in scripts/ rather than in the package, so the suite
# needs their directory on the path to import one.
pythonpath = ["scripts/data"]
